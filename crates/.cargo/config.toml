# FFMPEG_DIR relatif au dossier crates/ (portable dans le repo). Y déposer le build
# ffmpeg LGPL-shared (voir README). LIBCLANG_PATH = install LLVM locale (bindgen).
# Ces valeurs cèdent à une vraie variable d'environnement (force=false par défaut).
#
# Pinné sur le MÊME build release-branch (n8.1.2-34-g9b6c8969e0, tag BtbN
# autobuild-2026-07-31-14-10) que scripts/fetch-ffmpeg.mjs vendorise dans
# electron/native/bin/<tag>/ pour le packaging — pas un snapshot "master-latest"
# flottant. L'addon (compositor-view-napi) doit être lié à la même version de
# ffmpeg que celle shippée, sinon les DLLs vendorisées ne matchent pas les
# noms de DLL importés (avcodec-NN.dll etc.) et le require() échoue au runtime.
[env]
FFMPEG_DIR = { value = "thirdparty/ffmpeg-n8.1.2-win64-lgpl-shared", relative = true }
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"

# macOS : BtbN ne publie pas de build macOS (cf. scripts/fetch-ffmpeg.mjs), donc on
# laisse `crates/compositor/build.rs` chercher MAC_FFMPEG_DIR (env var explicite posée
# par la CI macOS ou par le dev local) ou un répertoire attendu sous `thirdparty/`.
# LIBCLANG_PATH est inutile sur macOS (clang est dans CommandLineTools), on ne le
# pose donc pas.
[target.'cfg(target_os = "macos")'.env]