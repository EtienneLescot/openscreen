[package]
name = "openscreen-compositor"
version.workspace = true
edition.workspace = true
description = "Compositeur natif multiplateforme d'OpenScreen : décodage, pipeline, effets, scène, curseur, audio, et la vue live embarquable. Code de production — l'addon Electron (compositor-view-napi) s'y lie, le POC (poc-d3d) le consomme aussi.\n\nWindows : D3D11 + D3D11VA + shaders HLSL compilés à l'exécution. macOS : Metal + VideoToolbox + shaders MSL (port de ce PR)."

[lib]
name = "openscreen_compositor"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.70"
cc = "1"

[features]
default = ["segmentation"]
# Segmentation IA de la webcam via ONNX Runtime (EP CPU).
#
# Activée par défaut, ce qui ne coûte rien au build : `ort` est lié en `load-dynamic`, donc
# aucune bibliothèque n'est nécessaire pour COMPILER. Elle l'est pour tourner — absente,
# `Segmenter::load` échoue, le compositeur écrit une ligne et dessine la webcam telle quelle.
# La désactiver reste possible pour une build qui ne veut pas du tout du code d'inférence.
segmentation = ["dep:ort", "dep:ndarray"]

[dependencies]
anyhow.workspace = true
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
image.workspace = true

# Windows : D3D11 + D3D11VA + Direct2D/DirectWrite + HLSL à l'exécution.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Native GIF export (slice 1 — behind a feature flag, the renderer still uses
# `gif.js` in `src/lib/exporter/gifExporter.ts`). The GIF89a writer, the LZW
# encoder, and the median-cut palette are all hand-rolled in `gif_export.rs` —
# no new crate deps, no GPL pull-ins, no swscale round-trip. See
# `gif_export.rs` for the readback path and the wall-time expectations; the
# bench in `crates/poc-d3d/src/bench.rs` is the honest signal.

# macOS : Metal + CoreVideo/VideoToolbox. Le port Metal/VideoToolbox de ce crate
# s'appuie sur `metal` (bindings purs Rust du framework Metal, sans CC), `objc`/
# `block` pour CVMetalTextureCache/IOSurface (CoreVideo n'expose pas cette API),
# `core-foundation` pour le comptage de références CF. CVPixelBuffer est attaqué
# en FFI brut plutôt que via `core-video-rs` 0.1 — l'API publique de cette crate
# est trop mince pour le gain et la version pinnée n'expose pas tous les
# symboles dont on a besoin (CVMetalTextureCache notamment). Bindgen reste
# utilisé pour ffmpeg (les headers VT dans wrapper.h sont interchangeables avec
# ceux de D3D11VA, mêmes prototypes dans les grandes lignes mais format hw
# différent).
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
block = "0.1"
core-foundation = "0.9"

# Linux : wgpu (Vulkan) pour le rendu, pollster pour block_on les ops wgpu,
# cosmic-text pour la rastérisation du texte (remplace DirectWrite/CoreText).
[target.'cfg(target_os = "linux")'.dependencies]
wgpu.workspace = true
pollster.workspace = true
cosmic-text.workspace = true
