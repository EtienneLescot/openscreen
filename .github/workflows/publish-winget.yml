name: Publish release to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to winget (e.g. v1.4.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    # La condition de configuration a QUITTÉ ce `if`, et c'est tout l'objet du
    # changement. `vars.WINGET_IDENTIFIER != ''` ici rendait le job `skipped`, et un
    # job sauté est vert : les huit dernières releases, v1.8.0 comprise, ont toutes
    # « réussi » sans rien publier, et #148 est resté ouvert deux semaines parce que
    # rien, nulle part, ne le disait. Même famille que le glob zsync mort de
    # build.yml — un garde qui ne fait rien en silence ne garde rien.
    #
    # Le job démarre donc toujours, et c'est une étape qui annonce l'absence de
    # configuration. Le coût est une minute de runner par release ; le gain est que
    # « pas publié » devienne visible dans le résumé du run.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    env:
      IDENTIFIER: ${{ vars.WINGET_IDENTIFIER }}
      # `secrets` n'est PAS un contexte lisible depuis un `if`, ni au niveau du job ni
      # au niveau de l'étape — seul `env` l'est. D'où ce booléen-en-chaîne, qui expose
      # la présence du token sans jamais exposer sa valeur.
      HAS_TOKEN: ${{ secrets.WINGET_ACC_TOKEN != '' }}
    steps:
      - name: Report that winget publishing is not configured
        if: env.IDENTIFIER == '' || env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=winget publishing skipped::Nothing was published to winget. Needs the repository variable WINGET_IDENTIFIER (the winget package identifier, e.g. OpenScreen.OpenScreen) and the secret WINGET_ACC_TOKEN (a PAT with public_repo scope, on an account that has forked microsoft/winget-pkgs). Currently WINGET_IDENTIFIER=${{ env.IDENTIFIER == '' && 'unset' || 'set' }}, WINGET_ACC_TOKEN=${{ env.HAS_TOKEN == 'true' && 'set' || 'unset' }}. See https://github.com/getopenscreen/openscreen/issues/148"

      # Épinglé sur le SHA de v2 : un tag git est mutable, et cette action tierce
      # reçoit WINGET_ACC_TOKEN. Un tag repointé suffirait à exfiltrer le token
      # sans qu'aucun changement n'apparaisse ici. Pour bouger de version,
      # re-résoudre le tag et remplacer le SHA explicitement.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: env.IDENTIFIER != '' && env.HAS_TOKEN == 'true'
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER }}
          # Matches the Windows installer asset attached to each release,
          # e.g. "Openscreen.Setup.1.5.0.exe".
          installers-regex: 'Setup\..*\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_ACC_TOKEN }}
